<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>Grid布局</title>
        <style>
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;   /* 三等宽列 */
                gap: 10px;
            }
            .grid > div {
                background: #4f46e5;
                color: white;
                padding: 20px;
                text-align: center;
            }
        </style>
        
    </head>
    <body>
        <div class="grid">
            <div>1</div><div>2</div><div>3</div>
            <div>4</div><div>5</div><div>6</div
        </div>
    </body>
</html>
