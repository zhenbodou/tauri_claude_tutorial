<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <title>flex布局</title>
        <style>
            .row {
                display: flex;
                gap: 10px;
                background-color: aliceblue;
                padding: 10px;
            }
            .row > div {
                background-color: #2563eb;
                color: white;
                padding: 20px;
            }
        </style>
    </head>

    <body>
        <div class="row">
            <div>A</div>
            <div>B</div>
            <div>C</div>
        </div>
    </body>
</html>
