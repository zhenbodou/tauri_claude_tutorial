<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>按钮样式练习</title>
    <style>
      button {
        border: none;
        border-radius: 6px;
        padding: 12px 20px;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .primary {
        background-color: #2563eb;
      }

      .primary:hover {
        background-color: #1d4ed8;
      }

      .danger {
        background-color: #dc2626;
      }

      .danger:hover {
        background-color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <button class="primary">蓝色按钮</button>
    <button class="danger">红色按钮</button>
  </body>
</html>
